<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style>
:root{
  --fs:21px;
  --paper:#fbfaf7; --ink:#1d1f22; --muted:#5d6670; --line:#e2e0da; --side:#f2f0eb;
  --main:#1f4fa3; --var:#2b2f36; --hl:#ffe08a; --hlink:#e8eefb;
  --light:#dee3e6; --dark:#8ca2ad; --lm:rgba(155,199,0,.45); --sel:rgba(20,85,30,.5);
  --btn:#ffffff; --btnb:#cfd5db;
}
:root[data-theme="dark"]{
  --paper:#16191d; --ink:#e4e6e9; --muted:#9aa3ad; --line:#2c3238; --side:#1d2126;
  --main:#86b4ff; --var:#d5d9de; --hl:#6b5a1e; --hlink:#25324a;
  --btn:#232930; --btnb:#3a434c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;font-size:var(--fs);line-height:1.6}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--side);border-bottom:1px solid var(--line);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.top a.lib{color:var(--main);text-decoration:none;font-weight:600;white-space:nowrap}
.top .t{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;font-family:system-ui,"Segoe UI",sans-serif;background:var(--btn);color:var(--ink);border:1px solid var(--btnb);border-radius:7px;padding:6px 12px;cursor:pointer;min-width:40px}
button:hover{border-color:var(--main)}
button:disabled{opacity:.35;cursor:default}
/* layout */
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr) auto;align-items:start}
nav.toc{position:sticky;top:49px;height:calc(100vh - 49px);overflow:auto;padding:18px 14px;border-right:1px solid var(--line);background:var(--side);font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
nav.toc .h{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:12px;letter-spacing:.06em;margin-bottom:8px}
nav.toc a{display:block;padding:7px 10px;border-radius:6px;color:var(--ink);text-decoration:none;cursor:pointer}
nav.toc a:hover,nav.toc a.on{background:var(--hlink);color:var(--main)}
main{padding:28px 40px 120px;max-width:44em;margin:0 auto;width:100%}
aside.bp{position:sticky;top:49px;padding:16px 20px;border-left:1px solid var(--line);height:calc(100vh - 49px);overflow:auto;width:calc(var(--bw) + 70px)}
:root{--bw:min(44vw, calc(100vh - 290px), 680px)}
/* article */
.kicker{font-family:system-ui,"Segoe UI",sans-serif;font-size:.7em;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
h1{font-family:system-ui,"Segoe UI",sans-serif;font-size:2.3em;line-height:1.1;margin:.2em 0 .15em}
.dek{color:var(--main);font-size:1.2em;margin:.2em 0}
.byline{font-family:system-ui,"Segoe UI",sans-serif;font-size:.75em;font-weight:700;letter-spacing:.03em;margin-top:.6em}
.byline span{font-weight:400;color:var(--muted)}
h2{font-family:system-ui,"Segoe UI",sans-serif;font-size:1.25em;margin:1.8em 0 .5em;padding-top:.4em;border-top:2px solid var(--line)}
h3{font-family:system-ui,"Segoe UI",sans-serif;font-size:.95em;margin:.2em 0}
p{margin:.65em 0}
p.first::first-line{font-variant:small-caps}
.gamehead{font-size:.9em;line-height:1.5;margin:.4em 0 .8em;color:var(--muted)}
.gamehead b{color:var(--ink)}
/* moves */
a.mv{cursor:pointer;border-radius:4px;padding:0 2px;color:var(--var);text-decoration:none;border-bottom:1px dotted var(--muted)}
a.mv:hover{background:var(--hlink)}
a.mv.cur{background:var(--hl);border-bottom-color:transparent}
p.ml{font-weight:700;font-size:1.12em;margin:1em 0 .4em}
p.ml a.mv{color:var(--main);border-bottom:none}
p.ml.key{font-size:1.25em}
.lines{border-left:3px solid var(--line);padding-left:1em;margin:1em 0}
.tip{font-family:system-ui,"Segoe UI",sans-serif;font-size:.75em;color:var(--muted);display:block;margin-top:.3em}
.note{font-size:.85em;color:var(--muted);font-style:italic}
/* static diagrams */
figure.dia{margin:1.2em 0;cursor:pointer;width:max-content;max-width:100%}
figure.dia figcaption{font-family:system-ui,"Segoe UI",sans-serif;font-size:.75em;font-weight:600;color:var(--main);margin-top:4px}
figure.dia:hover .bd{outline:3px solid var(--main)}
.problems{display:flex;gap:28px;flex-wrap:wrap}
.pmeta{font-size:.78em;color:var(--muted);line-height:1.4}
/* boards */
.bwrap{display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;width:max-content}
.bd{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);aspect-ratio:1;border:2px solid #5b6f79;user-select:none}
.sq{position:relative}
.sq.l{background:var(--light)} .sq.d{background:var(--dark)}
.sq.lm::after{content:"";position:absolute;inset:0;background:var(--lm)}
.sq.sel::after{content:"";position:absolute;inset:0;background:var(--sel)}
.sq.tg::before{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(20,85,30,.45);z-index:2}
.pc{position:absolute;inset:0;background-size:100% 100%;z-index:1}
.rk{display:grid;grid-template-rows:repeat(8,1fr);font-family:system-ui,sans-serif;color:var(--muted);text-align:center;padding-right:5px}
.fl{grid-column:2;display:grid;grid-template-columns:repeat(8,1fr);font-family:system-ui,sans-serif;color:var(--muted);text-align:center}
.rk span{display:flex;align-items:center}
.sb .bd{width:min(290px,80vw)} .sb .rk,.sb .fl{font-size:12px}
#live .bd{width:var(--bw);cursor:pointer} #live .rk,#live .fl{font-size:14px}
/* board panel */
.bhead{font-family:system-ui,"Segoe UI",sans-serif;font-size:15px;color:var(--muted);margin-bottom:8px;min-height:1.4em;display:flex;justify-content:space-between;gap:10px}
.bhead b{color:var(--ink);font-size:17px}
.ctrls{display:flex;gap:6px;margin:12px 0 0 22px;flex-wrap:wrap}
.ctrls button{font-size:18px;padding:5px 12px}
.choose{margin:12px 0 0 22px;font-family:system-ui,"Segoe UI",sans-serif;font-size:15px}
.choose button{margin:4px 6px 0 0;font-size:16px}
.choose button.mainc{font-weight:700;color:var(--main)}
.path{margin:12px 0 0 22px;font-size:17px;line-height:1.7}
.path a.mv{border-bottom:none}
.path a.mv.cur{font-weight:700}
.path .u{font-style:italic;color:#b5602a}
.msg{margin:8px 0 0 22px;font-family:system-ui,"Segoe UI",sans-serif;font-size:14px;color:var(--muted)}
/* narrow screens: board on top */
@media (max-width:1100px){
  .wrap{grid-template-columns:1fr}
  nav.toc{display:none}
  aside.bp{order:-1;position:sticky;top:49px;z-index:10;height:auto;width:auto;border-left:0;border-bottom:1px solid var(--line);background:var(--paper)}
  :root{--bw:min(86vw, 42vh)}
  .path{display:none}
  main{padding:20px 16px 80px}
}
main p b a.mv,main p b{color:var(--main);font-weight:700}figure.pic{margin:1.4em 0}figure.dia img.orig{width:290px;max-width:100%;display:block}figure.pic img{max-width:100%;border-radius:6px;display:block}
</style>
<style>/*PIECES*/</style>
</head>
<body>
<div class="top">
  <a class="lib" href="../index.html" title="Back to the article library">← Library</a>
  <span class="t">%%TITLE%% — Pal Benko</span>
  <button id="fminus" title="Smaller text">A−</button>
  <button id="fplus" title="Larger text">A+</button>
  <button id="dark" title="Dark mode">Dark</button>
</div>
<div class="wrap">
  <nav class="toc">
    <div class="h">Contents</div>
%%TOC%%
  </nav>
  <main>
<!--BODY-->
  </main>
  <aside class="bp">
    <div class="bhead"><span id="who"></span><b id="cur"></b></div>
    <div id="live"></div>
    <div class="ctrls">
      <button id="bStart" title="Start (Home)">⏮</button>
      <button id="bPrev" title="Back (←)">◀</button>
      <button id="bNext" title="Forward (→)">▶</button>
      <button id="bEnd" title="End of line (End)">⏭</button>
      <button id="bFlip" title="Flip board (F)">⇅</button>
    </div>
    <div class="choose" id="choose"></div>
    <div class="msg" id="msg"></div>
    <div class="path" id="path"></div>
  </aside>
</div>
<script>/*CHESSJS*/</script>
<script>
/*NODES*/
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={get(k){try{return localStorage.getItem('el_'+k)}catch(e){return null}},set(k,v){try{localStorage.setItem('el_'+k,v)}catch(e){}}};
// node fields
const F=0,PAR=1,CH=2,SAN=3,LAB=4,FROM=5,TO=6,W=7;
let cur=FIRST, flipped=store.get('flip')==='1', sel=null, uSeq=0;
const rootOf=id=>{while(NODES[id][PAR])id=NODES[id][PAR];return id};
const files='abcdefgh';

function boardHTML(fen,opt={}){
  const rows=fen.split(' ')[0].split('/'); const grid=[];
  rows.forEach((r,ri)=>{let c=0;for(const ch of r){if(/\d/.test(ch))c+=+ch;else{grid[ri*8+c]=ch;c++}}});
  const fl=opt.flip; let sq='';
  for(let i=0;i<64;i++){
    const r=fl?7-Math.floor(i/8):Math.floor(i/8), c=fl?7-i%8:i%8;
    const name=files[c]+(8-r), p=grid[r*8+c];
    const cls=((r+c)%2?'d':'l')+((opt.lm||[]).includes(name)?' lm':'')+(opt.sel===name?' sel':'')+((opt.tg||[]).includes(name)?' tg':'');
    sq+=`<div class="sq ${cls}" data-sq="${name}">${p?`<div class="pc ${p===p.toUpperCase()?'w':'b'}${p.toUpperCase()}"></div>`:''}</div>`;
  }
  const rk=[...Array(8)].map((_,i)=>`<span>${fl?i+1:8-i}</span>`).join('');
  const fs=[...Array(8)].map((_,i)=>`<span>${files[fl?7-i:i]}</span>`).join('');
  return `<div class="bwrap"><div class="rk">${rk}</div><div class="bd">${sq}</div><div class="fl">${fs}</div></div>`;
}
// static diagrams
$$('.sb').forEach(el=>el.innerHTML=boardHTML(el.dataset.fen));
$$('figure.dia').forEach(f=>f.addEventListener('click',()=>go(f.dataset.id,true)));

function render(){
  const n=NODES[cur], game=new Chess(n[F]);
  let tg=[];
  if(sel) tg=game.moves({square:sel,verbose:true}).map(m=>m.to);
  $('#live').innerHTML=boardHTML(n[F],{flip:flipped,lm:n[FROM]?[n[FROM],n[TO]]:[],sel,tg});
  const r=rootOf(cur);
  $('#who').textContent=(ROOTS[r]||[''])[0];
  $('#cur').textContent=n[LAB]||(ROOTS[r]||['',''])[1]||'Start position';
  const side=n[F].split(' ')[1]==='w'?'White':'Black';
  let m='';
  if(game.in_checkmate())m='Checkmate.';else if(game.in_stalemate())m='Stalemate.';else if(game.in_draw())m='Draw.';
  $('#msg').textContent=m||(side+' to move · click a piece to try your own move');
  // choices
  const ch=n[CH];
  $('#choose').innerHTML=ch.length>1?'Choose a line: '+ch.map((c,i)=>`<button class="${i?'':'mainc'}" data-id="${c}">${NODES[c][LAB]}</button>`).join(''):'';
  // path
  const path=[];let x=cur;while(NODES[x][PAR]){path.unshift(x);x=NODES[x][PAR]}
  $('#path').innerHTML=path.map((id,i)=>{const z=NODES[id];const t=(z[W]||i===0)?z[LAB]:z[SAN];return `<a class="mv${id[0]==='u'?' u':''}${id===cur?' cur':''}" data-id="${id}">${t}</a>`}).join(' ');
  $('#bPrev').disabled=$('#bStart').disabled=!n[PAR];
  $('#bNext').disabled=$('#bEnd').disabled=!ch.length;
  // highlight in text
  $$('main a.mv.cur').forEach(a=>a.classList.remove('cur'));
  const t=$$(`main a.mv[data-id="${cur}"]`);
  t.forEach(a=>a.classList.add('cur'));
  return t[0];
}
function go(id,fromText){
  if(!NODES[id])return; cur=id; sel=null;
  const a=render();
  if(a&&!fromText){const r=a.getBoundingClientRect(); if(r.top<80||r.bottom>innerHeight-20)a.scrollIntoView({block:'center',behavior:'smooth'})}
  if(id[0]!=='u')store.set('pos_'+SLUG,id);
}
const next=()=>{const c=NODES[cur][CH];if(c.length)go(c[0])};
const prev=()=>{const p=NODES[cur][PAR];if(p)go(p)};
const start=()=>go(rootOf(cur));
const end=()=>{let x=cur;while(NODES[x][CH].length)x=NODES[x][CH][0];go(x)};
const flip=()=>{flipped=!flipped;store.set('flip',flipped?'1':'0');render()};
$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bStart').onclick=start;$('#bEnd').onclick=end;$('#bFlip').onclick=flip;
document.addEventListener('click',e=>{
  const a=e.target.closest('a.mv, #choose button'); if(a){go(a.dataset.id,a.closest('main')!==null);return}
  const t=e.target.closest('nav.toc a'); if(t){document.getElementById(t.dataset.t).scrollIntoView({behavior:'smooth'})}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'){next();e.preventDefault()}else if(k==='ArrowLeft'){prev();e.preventDefault()}
  else if(k==='Home'){start();e.preventDefault()}else if(k==='End'){end();e.preventDefault()}
  else if(k==='f'||k==='F')flip();
});
// try-your-own-move on the live board
$('#live').addEventListener('click',e=>{
  const s=e.target.closest('.sq'); if(!s)return; const sq=s.dataset.sq;
  const n=NODES[cur], game=new Chess(n[F]);
  if(sel){
    const mv=game.moves({square:sel,verbose:true}).find(m=>m.to===sq);
    if(mv){
      const res=game.move({from:sel,to:sq,promotion:'q'});
      const ex=n[CH].find(c=>NODES[c][FROM]===res.from&&NODES[c][TO]===res.to&&NODES[c][SAN].replace(/[!?]+$/,'')===res.san);
      if(ex){go(ex);return}
      const parts=n[F].split(' '),num=+parts[5],w=parts[1]==='w';
      const id='u'+(++uSeq);
      NODES[id]=[game.fen(),cur,[],res.san,(w?num+'.':num+'...')+res.san,res.from,res.to,w?1:0];
      n[CH].push(id); go(id); return;
    }
  }
  const p=game.get(sq);
  sel=(p&&p.color===game.turn()&&sel!==sq)?sq:null; render();
});
// text size & dark mode
let fs=+store.get('fs')||21;
const setFs=v=>{fs=Math.max(15,Math.min(34,v));document.documentElement.style.setProperty('--fs',fs+'px');store.set('fs',fs)};
$('#fplus').onclick=()=>setFs(fs+2);$('#fminus').onclick=()=>setFs(fs-2);setFs(fs);
const setDark=d=>{document.documentElement.dataset.theme=d?'dark':'light';$('#dark').textContent=d?'Light':'Dark';store.set('dark',d?'1':'0')};
let dk=store.get('dark')==='1';setDark(dk);$('#dark').onclick=()=>{dk=!dk;setDark(dk)};
// contents highlight
const secs=$$('nav.toc a').map(a=>document.getElementById(a.dataset.t));
addEventListener('scroll',()=>{let on=0;secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)on=i});$$('nav.toc a').forEach((a,i)=>a.classList.toggle('on',i===on))},{passive:true});
const saved=store.get('pos_'+SLUG); go(saved&&NODES[saved]?saved:FIRST,true);
})();
</script>
</body>
</html>
